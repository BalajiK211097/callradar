services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callradar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed.sql.gz:/docker-entrypoint-initdb.d/seed.sql.gz
    ports:
      - "5432:5432"
    networks:
      - callradar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Override DATABASE_URL so it points at the postgres service, not localhost
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/callradar
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - callradar
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - callradar
    restart: unless-stopped

networks:
  callradar:
    driver: bridge

volumes:
  postgres_data:
